[project]
name = "essensplaner"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "logic" ist ohne Home Assistant importierbar (Logik-Tests laufen auch lokal).
pythonpath = [".", "custom_components/essensplaner"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
