generate_plan:
  fields:
    start_date:
      selector:
        date:
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 28
          mode: box
    meal_types:
      selector:
        select:
          multiple: true
          translation_key: meal_type
          options:
            - breakfast
            - lunch
            - dinner
            - snack
    profiles:
      selector:
        text:
          multiple: true
    overwrite:
      default: false
      selector:
        boolean:
    alternatives:
      selector:
        number:
          min: 0
          max: 3
          mode: box

push_shopping_list:
  fields:
    start_date:
      selector:
        date:
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 28
          mode: box
    entity_id:
      selector:
        entity:
          domain: todo
    skip_existing:
      default: true
      selector:
        boolean:

set_meal:
  fields:
    date:
      required: true
      selector:
        date:
    meal_type:
      required: true
      selector:
        select:
          translation_key: meal_type
          options:
            - breakfast
            - lunch
            - dinner
            - snack
    dish:
      selector:
        text:
    profiles:
      selector:
        text:
          multiple: true
    servings:
      selector:
        number:
          min: 0.5
          max: 20
          step: 0.5
          mode: box

choose_meal:
  fields:
    date:
      required: true
      selector:
        date:
    meal_type:
      required: true
      selector:
        select:
          translation_key: meal_type
          options:
            - breakfast
            - lunch
            - dinner
            - snack
    dish:
      required: true
      selector:
        text:
    index:
      default: 0
      selector:
        number:
          min: 0
          max: 20
          mode: box
